[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-hotkey-app"
version = "0.1.0"
description = "Windows tray application that sends selected text to the OpenAI Chat API via a global hotkey."
readme = "gpt_hotkey_app/README.md"
authors = [{name = "MouseSolver"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.51",
    "python-dotenv>=1.0",
    "keyboard>=0.13",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "Pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gpt-hotkey-app = "gpt_hotkey_app.main:main"

[tool.setuptools]
packages = ["gpt_hotkey_app"]
include-package-data = false

[tool.setuptools.package-dir]
"" = "."
